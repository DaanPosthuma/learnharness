name: Deploy web app

# Build the web image on GitHub's runners and roll it onto the one-box AWS
# deployment (docs/mobile-deployment.md). The production instance never
# builds anything: it pulls the finished image and restarts the app
# container (~10 s). Auth is OIDC — the role trusts only this repo's main
# branch; there are no long-lived AWS keys in the repo secrets.
#
# Fork-local: this workflow belongs to the DaanPosthuma fork's deployment
# and is a no-op anywhere else.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time, in order; never cancel a push that is half done.
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ROLE: arn:aws:iam::489323024070:role/learnharness-github-deploy
  ECR_IMAGE: 489323024070.dkr.ecr.eu-west-2.amazonaws.com/learnharness-web
  INSTANCE_ID: i-00d4a1eab8468a1b5
  SITE: https://3-11-119-60.sslip.io

jobs:
  deploy:
    name: Build image, push to ECR, update the box
    if: github.repository == 'DaanPosthuma/learnharness'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_IMAGE }}:latest
            ${{ env.ECR_IMAGE }}:${{ github.sha }}
          # The dependency layer rarely changes; the GitHub cache keeps it
          # from being rebuilt on every app-only push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the box onto the new image
        shell: bash
        run: |
          set -euo pipefail
          cmd=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["/usr/local/bin/lh-update"]' \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)
          echo "ssm command $cmd"
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text
                echo "::error::lh-update ended with $status"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = Success ] || { echo "::error::lh-update did not finish in time"; exit 1; }
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text | tail -5

      - name: Check the site answers
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS -m 10 "$SITE/gateway/health" >/dev/null; then echo "healthy: $SITE"; exit 0; fi
            sleep 5
          done
          echo "::error::$SITE did not answer after the update"; exit 1
